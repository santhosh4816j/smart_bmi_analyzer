name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Release EXE + MSIX
    # Pinned to windows-2022 (not windows-latest) because the newest
    # runner image ships Visual Studio 2026, whose MSVC toolchain removed
    # the deprecated <experimental/coroutine> header that older plugins
    # like permission_handler_windows still depend on internally. This
    # breaks the build with error C2338 until those plugins update.
    # Revisit/remove this pin once affected plugins ship a fix.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            %LOCALAPPDATA%\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure windows/ platform folder exists
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            Write-Host "windows/ folder not found in repo — scaffolding it now."
            flutter create . --platforms=windows
          } else {
            Write-Host "windows/ folder already present."
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Compress Windows build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath SmartBMIAnalyzer-Windows.zip
        shell: pwsh

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-bmi-analyzer-windows-zip
          path: SmartBMIAnalyzer-Windows.zip

      # NOTE: This produces an UNSIGNED .msix suitable for local sideload
      # testing and for uploading directly to Partner Center (which can
      # sign on ingestion). To ship a package signed with your own EV
      # certificate instead, add the certificate as a repo secret, write
      # it to disk in this step, and add `certificate_path` /
      # `certificate_password` to the msix_config block in pubspec.yaml
      # before running this command. Never commit a real .pfx to the repo.
      - name: Create MSIX package
        run: dart run msix:create

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-bmi-analyzer-msix
          path: build/windows/x64/runner/Release/*.msix
